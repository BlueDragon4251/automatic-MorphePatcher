name: Dispatch corrected full patch build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-full-patch-test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run patch-youtube.yml --repo BlueDragon4251/automatic-MorphePatcher --ref main -f force=true
