name: Dispatch TikTok patcher test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-tiktok-test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate pending TikTok build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 32966960026 --repo BlueDragon4251/automatic-MorphePatcher

# one-shot cleanup: keep only the already-running verifier-fix production build
