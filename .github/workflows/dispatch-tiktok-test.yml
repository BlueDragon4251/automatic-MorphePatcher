name: Dispatch TikTok patcher test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-tiktok-test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TikTok full patch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run patch-tiktok.yml --repo BlueDragon4251/automatic-MorphePatcher --ref main -f force=true

