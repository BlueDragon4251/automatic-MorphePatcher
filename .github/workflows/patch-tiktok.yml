name: Automatic Morphe TikTok Patcher

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-tiktok.yml"
      - "scripts/resolve_tiktok.py"
      - "scripts/plan_tiktok.py"
      - "scripts/configure_tiktok_patch_selection.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Build/notify even if the tracked TikTok state is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: automatic-morphe-tiktok
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install resolver dependencies
        run: pip install -r requirements.txt
      - name: Resolve latest stable TikTok patches and Morphe extras
        id: resolve
        run: python scripts/resolve_tiktok.py
      - name: Determine Original TikTok release channel
        id: original
        run: |
          python scripts/apkmirror_tiktok.py --version "${{ steps.resolve.outputs.tiktok_version }}" --metadata build/tiktok-original.json --status-only
      - name: Plan this run
        id: plan
        run: python scripts/plan_tiktok.py
      - name: Nothing changed
        if: steps.plan.outputs.changed != 'true'
        run: echo "No stable TikTok patch, supported TikTok target, Original channel, or official Morphe extra bundle change detected."
      - name: Validate required secrets
        if: steps.plan.outputs.changed == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MORPHE_KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_B64 }}
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          MORPHE_KEY_ALIAS: ${{ secrets.MORPHE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_BOT_TOKEN" || exit 1
          test -n "$DISCORD_CHANNEL_ID" || exit 1
          if [ "${{ steps.plan.outputs.needs_build }}" = "true" ]; then
            test -n "$MORPHE_KEYSTORE_B64" || exit 1
            test -n "$MORPHE_KEYSTORE_PASSWORD" || exit 1
            test -n "$MORPHE_KEY_ALIAS" || exit 1
          fi
      - name: Set up Java 21
        if: steps.plan.outputs.needs_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK is not available on this runner"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found in $SDK_ROOT"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android build tools
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Download TikTok bundle, official Morphe extras bundle, and Morphe Desktop
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          mkdir -p build dist
          curl --fail --location --retry 3 "${{ steps.resolve.outputs.mpp_url }}" --output build/tiktok-patches.mpp
          curl --fail --location --retry 3 "${{ steps.resolve.outputs.morphe_extra_mpp_url }}" --output build/morphe-extra-patches.mpp
          curl --fail --location --retry 3 "${{ steps.resolve.outputs.desktop_jar_url }}" --output build/morphe-desktop.jar
      - name: Download exact Original TikTok APK
        if: steps.plan.outputs.needs_build == 'true'
        run: python scripts/apkmirror_tiktok.py --version "${{ steps.resolve.outputs.tiktok_version }}" --metadata build/tiktok-original.json --out build/tiktok-original.apk
      - name: Verify Original TikTok APK
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs build/tiktok-original.apk
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)"; fi
          test -x "$APKANALYZER" || exit 1
          test "$($APKANALYZER manifest application-id build/tiktok-original.apk)" = "com.zhiliaoapp.musically"
          test "$($APKANALYZER manifest version-name build/tiktok-original.apk)" = "${{ steps.resolve.outputs.tiktok_version }}"
      - name: Restore signing key
        if: steps.plan.outputs.needs_build == 'true'
        env:
          MORPHE_KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$MORPHE_KEYSTORE_B64" | base64 --decode > build/morphe-signing.keystore
          test -s build/morphe-signing.keystore
      - name: Select all TikTok patches plus two official Morphe patches
        if: steps.plan.outputs.needs_build == 'true'
        id: full
        run: |
          java -jar build/morphe-desktop.jar options-create --patches build/tiktok-patches.mpp --patches build/morphe-extra-patches.mpp --out build/tiktok-full-patch-options.json --filter-package-name com.zhiliaoapp.musically
          python scripts/configure_tiktok_patch_selection.py build/tiktok-full-patch-options.json
      - name: Full Morphe TikTok patch
        if: steps.plan.outputs.needs_build == 'true'
        env:
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          MORPHE_KEY_ALIAS: ${{ secrets.MORPHE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          OUT="dist/${{ steps.resolve.outputs.asset_name }}"
          java -jar build/morphe-desktop.jar patch --patches build/tiktok-patches.mpp --patches build/morphe-extra-patches.mpp --options-file build/tiktok-full-patch-options.json --keystore build/morphe-signing.keystore --keystore-password "$MORPHE_KEYSTORE_PASSWORD" --keystore-entry-alias "$MORPHE_KEY_ALIAS" --keystore-entry-password "$MORPHE_KEYSTORE_PASSWORD" --result-file build/tiktok-patch-result.json --out "$OUT" build/tiktok-original.apk
          test -s "$OUT"
      - name: Verify patched TikTok APK
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          APK="dist/${{ steps.resolve.outputs.asset_name }}"
          apksigner verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)"; fi
          test -x "$APKANALYZER" || exit 1
          test "$($APKANALYZER manifest application-id "$APK")" = "com.zhiliaoapp.musically"
          test "$($APKANALYZER manifest version-name "$APK")" = "${{ steps.resolve.outputs.tiktok_version }}"
          DEXDUMP="$(command -v dexdump || true)"
          test -x "$DEXDUMP" || exit 1
          rm -rf build/tiktok-dex-verify; mkdir -p build/tiktok-dex-verify
          DEX_COUNT=0
          while IFS= read -r dex; do
            DEX_COUNT=$((DEX_COUNT + 1)); out="build/tiktok-dex-verify/$(basename "$dex")"; unzip -p "$APK" "$dex" > "$out"; test -s "$out"; "$DEXDUMP" -f "$out" >/dev/null
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          test "$DEX_COUNT" -gt 0
          sha256sum "$APK" | tee build/tiktok-patched.sha256
      - name: Create TikTok build manifest and release notes
        if: steps.plan.outputs.needs_build == 'true'
        env:
          FULL_PATCH_COUNT: ${{ steps.full.outputs.full_patch_total }}
          TIKTOK_PATCH_COUNT: ${{ steps.full.outputs.tiktok_patch_total }}
          MORPHE_EXTRA_COUNT: ${{ steps.full.outputs.morphe_extra_total }}
        run: |
          set -euo pipefail
          APK="dist/${{ steps.resolve.outputs.asset_name }}"; export APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"; export APK_ASSET="${{ steps.resolve.outputs.asset_name }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          resolved=json.loads(Path('build/tiktok-resolved.json').read_text()); original=json.loads(Path('build/tiktok-original.json').read_text()); features=resolved['features']
          patch_count=int(os.environ.get('FULL_PATCH_COUNT') or len(features)); tiktok_count=int(os.environ.get('TIKTOK_PATCH_COUNT') or resolved['tiktok_feature_count']); extra_count=int(os.environ.get('MORPHE_EXTRA_COUNT') or len(resolved['morphe_extra_patch_names']))
          info={'tiktokVersion':resolved['tiktok_version'],'patchesVersion':resolved['patch_version'],'patchRelease':resolved['patch_tag'],'patchReleaseChannel':'stable','morpheExtraPatchesVersion':resolved['morphe_extra_patch_version'],'morpheExtraPatchesRelease':resolved['morphe_extra_patch_tag'],'morpheExtraPatchNames':resolved['morphe_extra_patch_names'],'originalChannel':original['channel'],'fullPatchCount':patch_count,'tiktokPatchCount':tiktok_count,'morpheExtraPatchCount':extra_count,'features':features,'asset':os.environ['APK_ASSET'],'sha256':os.environ['APK_SHA']}
          Path('build/tiktok-build-info.json').write_text(json.dumps(info,indent=2,ensure_ascii=False)+'\n')
          extra_names=', '.join(resolved['morphe_extra_patch_names']); lines=[f"**TikTok Version:** {resolved['tiktok_version']} (supported target)",'',f"**TikTok Patches Version:** {resolved['patch_version']} (latest stable)",'',f"**Official Morphe Extras:** {resolved['morphe_extra_patch_version']} (latest stable) — {extra_names}",'',f"**Selected Patch Set:** {patch_count} Patches aktiviert ({tiktok_count} TikTok + {extra_count} Morphe Extras)",'','## Features','']
          for f in features:
            line=f"- **{f['name']}**"; line += f" — {f['description']}" if f.get('description') else ''; line += f" (configured: `{f['configured_value']}`)" if f.get('configured_value') else ''; lines.append(line)
          lines += ['',f"SHA-256: `{os.environ['APK_SHA']}`",'']; Path('build/tiktok-release-notes.md').write_text('\n'.join(lines))
          PY
      - name: Publish or repair TikTok GitHub Release
        if: steps.plan.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.release_tag }}"; APK="dist/${{ steps.resolve.outputs.asset_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$APK" build/tiktok-build-info.json --clobber; gh release edit "$TAG" --title "TikTok ${{ steps.resolve.outputs.tiktok_version }} • BlueIT ${{ steps.resolve.outputs.patch_version }} + Morphe ${{ steps.resolve.outputs.morphe_extra_patch_version }}" --notes-file build/tiktok-release-notes.md; else gh release create "$TAG" "$APK" build/tiktok-build-info.json --title "TikTok ${{ steps.resolve.outputs.tiktok_version }} • BlueIT ${{ steps.resolve.outputs.patch_version }} + Morphe ${{ steps.resolve.outputs.morphe_extra_patch_version }}" --notes-file build/tiktok-release-notes.md; fi
      - name: Get published TikTok APK SHA-256
        if: steps.plan.outputs.changed == 'true'
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.release_tag }}"; ASSET="${{ steps.resolve.outputs.asset_name }}"; URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"; echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          if [ -f "dist/$ASSET" ]; then SHA="$(sha256sum "dist/$ASSET" | awk '{print $1}')"; else rm -rf build/tiktok-release-asset; mkdir -p build/tiktok-release-asset; gh release download "$TAG" --pattern "$ASSET" --dir build/tiktok-release-asset; SHA="$(sha256sum "build/tiktok-release-asset/$ASSET" | awk '{print $1}')"; fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Send TikTok Discord bot embed
        if: steps.plan.outputs.needs_notify == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          PATCH_COUNT: ${{ steps.full.outputs.full_patch_total || steps.resolve.outputs.feature_count }}
        run: python scripts/discord_notify_tiktok.py --token "$DISCORD_BOT_TOKEN" --channel "$DISCORD_CHANNEL_ID" --tiktok-version "${{ steps.resolve.outputs.tiktok_version }}" --patch-version "${{ steps.resolve.outputs.patch_version }}" --patch-count "$PATCH_COUNT" --features-json build/tiktok-features.json --download-url "${{ steps.published.outputs.download_url }}" --sha256 "${{ steps.published.outputs.sha256 }}"
      - name: Record successfully published TikTok state
        if: steps.plan.outputs.needs_notify == 'true'
        run: |
          set -euo pipefail
          git fetch origin main; git rebase origin/main
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          r=json.loads(Path('build/tiktok-resolved.json').read_text()); o=json.loads(Path('build/tiktok-original.json').read_text())
          s={'tiktok_version':r['tiktok_version'],'patch_version':r['patch_version'],'patch_tag':r['patch_tag'],'morphe_extra_patch_version':r['morphe_extra_patch_version'],'morphe_extra_patch_tag':r['morphe_extra_patch_tag'],'original_channel':o['channel'],'published_at':datetime.now(timezone.utc).isoformat(),'release_tag':r['release_tag']}
          Path('state-tiktok.json').write_text(json.dumps(s,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add state-tiktok.json
          if git diff --cached --quiet; then echo "TikTok state already current."; else git commit -m "chore: record published TikTok Morphe build"; for attempt in 1 2 3; do if git push origin HEAD:main; then exit 0; fi; git fetch origin main; git rebase origin/main; done; exit 1; fi
