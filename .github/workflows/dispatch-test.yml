name: Dispatch Morphe Patcher Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real Morphe workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run patch-youtube.yml -R "$GITHUB_REPOSITORY" --ref main -f force=true
